<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3040"/>
      <stop offset="1" stop-color="#0F1118"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EF2C8"/>
      <stop offset="1" stop-color="#3B9BFF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <radialGradient id="light" cx="0.5" cy="0" r="0.75"><stop offset="0" stop-color="#7F8CFF" stop-opacity="0.30"/><stop offset="1" stop-color="#7F8CFF" stop-opacity="0"/></radialGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
  </defs>
  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)">
    <!-- soft top light -->
    <rect x="100" y="100" width="824" height="620" fill="url(#light)"/>
    <!-- window bar -->
    <rect x="100" y="100" width="824" height="132" fill="url(#bar)"/>
    <rect x="100" y="231" width="824" height="2" fill="#FFFFFF" opacity="0.07"/>
    <circle cx="190" cy="166" r="21" fill="#FF5F57"/>
    <circle cx="256" cy="166" r="21" fill="#FEBC2E"/>
    <circle cx="322" cy="166" r="21" fill="#28C840"/>
    <!-- prompt glow -->
    <g filter="url(#glow)" opacity="0.55">
      <path d="M262 440 L450 580 L262 720" fill="none" stroke="url(#prompt)" stroke-width="86" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="520" y="688" width="244" height="64" rx="32" fill="url(#prompt)"/>
    </g>
    <!-- prompt -->
    <path d="M262 440 L450 580 L262 720" fill="none" stroke="url(#prompt)" stroke-width="86" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="520" y="688" width="244" height="64" rx="32" fill="url(#prompt)"/>
  </g>
  <!-- rim light -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="182.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
