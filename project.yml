name: BetterTerminal
options:
  bundleIdPrefix: com.better
  deploymentTarget:
    macOS: "14.0"
packages:
  BetterTerminal:
    path: .
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  BetterTerminal:
    type: application
    platform: macOS
    sources:
      - App
      - path: Resources/AppIcon.png
        buildPhase: resources
    dependencies:
      - package: BetterTerminal
        product: BetterTerminalCore
      - package: SwiftTerm
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.better.terminal
        PRODUCT_NAME: Better Terminal
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 0.3.0
        SPARKLE_PUBLIC_ED_KEY: ""
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/BetterTerminal.entitlements
        CODE_SIGN_STYLE: Automatic
